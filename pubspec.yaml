name: colorlens
description: Aplikasi Tes Buta Warna untuk Pelajar SMK
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  fl_chart: ^0.70.2
  image: ^4.5.3
  shared_preferences: ^2.3.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/ishihara/
